name: holdbook-market
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: holdbook
      POSTGRES_DB: holdbook
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - market-data:/var/lib/postgresql
    networks: [market]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U holdbook -d holdbook]
      interval: 2s
      timeout: 2s
      retries: 20
  api:
    build: ./engine
    ports: ["127.0.0.1:8787:8787"]
    depends_on:
      db:
        condition: service_healthy
    networks: [market, edge]
    init: true
networks:
  edge: {}
  market:
    internal: true
volumes:
  market-data:
