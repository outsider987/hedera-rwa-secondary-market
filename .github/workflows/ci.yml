name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Match the pinned npm version
        run: npm install --global npm@11.17.0
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
      - run: npm run test:swap
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  engine:
    runs-on: ubuntu-latest
    container: golang:1.27.1
    services:
      db:
        image: postgres:18.6
        env:
          POSTGRES_USER: holdbook
          POSTGRES_DB: holdbook_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U holdbook -d holdbook_test"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      HOLDBOOK_TEST_DATABASE_URL: postgres://holdbook@db:5432/holdbook_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: go test ./... && go test -race ./... && go vet ./... && go test -fuzz=FuzzConservation -fuzztime=3s
        working-directory: engine
